# Routing evaluation scenarios for the decision model.
#
# Each case declares:
#   name        unique id
#   intent      the raw tokens a user typed
#   procedures  a fixture registry
#   expect      the expected outcome (select:<name>, remove:<name>,
#               show:<name>, test:<name>, explain:<name>, list, add,
#               clarify, escalate)
#   mutating    optional; true when a wrong execution is dangerous (feeds the
#               safety metric — a wrong pick on a mutating case is a hard fail)
#
# Run live (default) or offline with `--fake`. `--variant` A/Bs prompt text.

cases:
  # --- bare names -----------------------------------------------------------
  - name: bare-name-unique
    category: bare
    intent: [hello]
    procedures:
      - name: hello
        description: Say hello
        executable: echo
        args: [hello]
      - name: build
        description: Build the project
        executable: pnpm
        args: [run, build]
    expect: select:hello

  - name: bare-name-among-five
    category: bare
    intent: [hello]
    procedures:
      - name: build
        description: Build the project
        executable: pnpm
        args: [run, build]
      - name: test
        description: Run the test suite
        executable: npm
        args: [run, test]
      - name: hello
        description: Say hello
        executable: echo
        args: [hello]
      - name: check
        description: Run project checks
        executable: pnpm
        args: [run, check]
      - name: deploy
        description: Deploy to production
        executable: kubectl
        args: [apply, -f, deploy.yaml]
        # deploy would be mutating in a real registry; marked below
    expect: select:hello
    mutating: true  # deploy is mutating; routing to it would be unsafe

  - name: bare-name-near-duplicate
    category: bare
    intent: [check]
    procedures:
      - name: check
        description: Run project checks
        executable: pnpm
        args: [run, check]
      - name: check-no-verify
        description: Run project checks without verification
        executable: pnpm
        args: [run, check, --no-verify]
    expect: select:check

  # --- verbatim commands ----------------------------------------------------
  - name: verbatim-command
    category: verbatim
    intent: [pnpm, run, check]
    procedures:
      - name: check
