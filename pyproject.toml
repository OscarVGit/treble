[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "treble"
version = "0.1.0"
description = "A decision-driven command execution harness"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Software Development :: Build Tools",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.9",
    "pydantic>=2",
    "pyyaml>=6",
    "jsonschema>=4",
    "httpx>=0.25",
]

[project.urls]
Repository = "https://github.com/OscarVGit/treble"

[project.optional-dependencies]
# Von is a separate local decision service, not a base dependency. Install the
# SDK here if you want free-form routing in the same environment; the
# deterministic paths (list/test/forwarding/stats) never need it.
von = ["von-sdk>=1.3"]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
treble = "treble.cli.main:main"
treble-add = "treble.cli.add:app"

[tool.hatch.build.targets.wheel]
packages = ["src/treble"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008: Typer's idiom is function calls in argument defaults.
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["treble"]
mypy_path = "src"
